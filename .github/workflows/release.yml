name: Release
# A pushed tag v<version> makes the release: ScreenReplay-Setup-<version>.exe (Windows package) and
# ScreenReplay-mac.zip (macOS package, signed and notarized) built from the tag and put on its GitHub release, which is
# made here when it is not there yet (made by hand first, with notes of its own, it is kept and only given the files).
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # (the recorder's own, too: left behind, the new version takes itself for an old one and updates again and again)
      - name: The tag is the app's version
        run: |
          app=$(sed -n 's/^let app_version : String = "\(.*\)"$/\1/p' src/about.pion)
          rec=$(sed -n 's/.*const string AppVersion = "\(.*\)";.*/\1/p' recorder/Updater.cs)
          if [ "v$app" != "$GITHUB_REF_NAME" ] || [ "$rec" != "$app" ]; then
            echo "::error::tag $GITHUB_REF_NAME, app_version $app (src/about.pion) and AppVersion $rec (recorder/Updater.cs) are not one version"
            exit 1
          fi

      # (a script that does not parse stops the release here, not after the builds, at the publish step)
      - name: The scripts parse
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem packaging, scripts -Filter *.ps1 | ForEach-Object {
            $file = $_
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { "::error file=$($file.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }

  windows:
    needs: version
    uses: ./.github/workflows/windows.yml

  macos:
    needs: version
    uses: ./.github/workflows/macos.yml
    secrets: inherit

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Put the files on the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l assets
          setup="assets/ScreenReplay-Setup-${GITHUB_REF_NAME#v}.exe"
          sha256sum "$setup" assets/ScreenReplay-mac.zip
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$setup" assets/ScreenReplay-mac.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
              "$setup" assets/ScreenReplay-mac.zip
          fi

  # The download site and the updates: latest.json signed with the release key, the installer and the Mac build put in
  # the R2 bucket, the site deployed (packaging/publish-setup.ps1). The key and Cloudflare's token are the `release`
  # environment's alone: a v* tag's run, once its reviewer has approved it.
  publish:
    needs: release
    runs-on: windows-2022
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ScreenReplay-windows
          path: out/setup
      - uses: actions/download-artifact@v4
        with:
          name: ScreenReplay-mac
          path: out/mac
      - name: Sign, put in R2, deploy the site
        shell: pwsh
        env:
          SIGN_KEY: ${{ secrets.SCREENREPLAY_SIGN_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if (-not $env:SIGN_KEY -or -not $env:CLOUDFLARE_API_TOKEN) { throw "the release environment has no SCREENREPLAY_SIGN_KEY or CLOUDFLARE_API_TOKEN" }
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $env:SCREENREPLAY_SIGN_KEY = Join-Path $env:RUNNER_TEMP "release-key.pem"
          [IO.File]::WriteAllText($env:SCREENREPLAY_SIGN_KEY, $env:SIGN_KEY)
          try {
            ./packaging/publish-setup.ps1 -Version $version -MacZip out/mac/ScreenReplay-mac.zip
          } finally {
            Remove-Item -Force $env:SCREENREPLAY_SIGN_KEY
          }
          npx --yes wrangler pages deploy --project-name screenreplay --branch main --commit-dirty=true
          if ($LASTEXITCODE) { throw "pages deploy failed" }
      - name: The site says the new version
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS "https://screenreplay.pages.dev/dl/latest.json?t=$RANDOM" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)
            [ "$got" = "$want" ] && { echo "latest.json: $got"; exit 0; }
            sleep 10
          done
          echo "::error::screenreplay.pages.dev/dl/latest.json says '$got', not $want"
          exit 1
