<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScreenReplay — 赞助 | Support</title>
<link rel="icon" href="img/icon.png">
<style>
:root {
  --bg: #0a0b0e; --card: #16181f; --hair: rgba(255,255,255,0.08); --hair-strong: rgba(255,255,255,0.15);
  --t1: #f3f4f6; --t2: #a8aeb8; --t3: #6e7480; --chip: rgba(255,255,255,0.06);
  --btn-bg: #f3f4f6; --btn-t: #0a0b0e;
  --font: "Inter","Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;
}
html[data-theme="light"] {
  --bg: #f7f8fb; --card: #ffffff; --hair: rgba(15,18,26,0.08); --hair-strong: rgba(15,18,26,0.15);
  --t1: #111318; --t2: #4c515c; --t3: #787e8c; --chip: rgba(15,18,26,0.05);
  --btn-bg: #111318; --btn-t: #ffffff;
}
* { box-sizing: border-box; margin: 0; }
[hidden] { display: none !important; }
html { background: var(--bg); color: var(--t1); font: 400 16px/1.7 var(--font); -webkit-font-smoothing: antialiased; }
body { background: var(--bg); }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 820px; margin: 0 auto; padding: 0 24px; }
nav { height: 60px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--hair); }
nav img { width: 26px; height: 26px; border-radius: 7px; }
.sp { flex: 1; }
.icon-btn, .lang-btn {
  height: 32px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--hair-strong);
  background: transparent; color: var(--t2); font: 500 12px/1 var(--font); cursor: pointer;
}
.doc { padding: 52px 0 64px; }
.doc h1 { font-size: 36px; font-weight: 620; letter-spacing: -0.025em; }
.lead { color: var(--t2); margin-top: 10px; max-width: 34em; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 32px; }
.opt { display: grid; grid-row: span 4; grid-template-rows: subgrid; row-gap: 12px; padding: 24px; border-radius: 14px; background: var(--card); border: 1px solid var(--hair); }
.brand { display: inline-flex; align-items: center; gap: 10px; }
.logo { width: 28px; height: 28px; border-radius: 8px; display: inline-grid; place-items: center; flex: none; }
.logo.wx { background: #07c160; }
.logo.wx svg { width: 18px; height: 18px; }
.logo.kf { background: #fff; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.logo.kf img { width: 20px; height: auto; display: block; }
.opt-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.opt h2 { font-size: 18px; font-weight: 600; }
.chip { font-size: 12px; color: var(--t2); background: var(--chip); border-radius: 999px; padding: 2px 10px; }
.opt p { color: var(--t2); font-size: 14.5px; }
.qr { justify-self: center; align-self: start; width: 220px; max-width: 100%; margin-top: 4px; border-radius: 12px; display: block; background: #fff; }
a.qr { transition: transform .15s ease, box-shadow .15s ease; }
a.qr:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.qr img { display: block; width: 100%; height: auto; border-radius: 12px; }
.cap { justify-self: center; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--t3); }
a.cap { color: var(--t2); }
a.cap:hover { color: var(--t1); text-decoration: underline; text-underline-offset: 3px; }
a.cap svg { width: 12px; height: 12px; }
.opts:has(#kofi[hidden]) { grid-template-columns: minmax(0, 380px); }
.thanks { margin-top: 28px; color: var(--t3); font-size: 14px; }
footer { border-top: 1px solid var(--hair); padding: 24px 0 36px; color: var(--t3); font-size: 13px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
@media (max-width: 640px) {
  .opts { grid-template-columns: 1fr; }
  .doc h1 { font-size: 30px; }
}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a href="./" style="display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px"><img src="img/icon.png" alt=""><span>ScreenReplay</span></a>
    <span class="sp"></span>
    <a href="./" style="color:var(--t2);font-size:13.5px;padding:6px 10px" data-zh="返回首页" data-en="Home">返回首页</a>
    <button class="icon-btn" id="theme-toggle" type="button"></button>
    <button class="lang-btn" type="button">EN</button>
  </nav>

  <main class="doc">
    <h1 data-zh="赞助 ScreenReplay" data-en="Support ScreenReplay">赞助 ScreenReplay</h1>
    <p class="lead" data-zh="ScreenReplay 完全免费，没有广告，也不收集数据。如果它帮你存下过重要的一刻，欢迎请作者喝杯咖啡，支持它继续更新。"
       data-en="ScreenReplay is completely free, with no ads and no data collected. If it ever saved a moment that mattered, you can buy the author a coffee to keep it going.">ScreenReplay 完全免费，没有广告，也不收集数据。如果它帮你存下过重要的一刻，欢迎请作者喝杯咖啡，支持它继续更新。</p>

    <section class="opts">
      <article class="opt">
        <div class="opt-head">
          <div class="brand"><span class="logo wx"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.980 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.280 1.786-1.720 1.428-2.687 3.720-1.780 6.220.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.890c-.135-.01-.27-.027-.407-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z"/></svg></span><h2 data-zh="微信赞赏" data-en="WeChat Reward">微信赞赏</h2></div>
          <span class="chip" data-zh="中国大陆" data-en="Mainland China">中国大陆</span>
        </div>
        <p data-zh="用微信扫一扫下面的赞赏码，金额随意。" data-en="Scan the code below with WeChat. Any amount is welcome.">用微信扫一扫下面的赞赏码，金额随意。</p>
        <img class="qr" src="img/wechat-reward.jpg" alt="WeChat Reward Code" width="220" height="220">
        <span class="cap" data-zh="微信 › 扫一扫" data-en="WeChat › Scan">微信 › 扫一扫</span>
      </article>
      <article class="opt" id="kofi" hidden>
        <div class="opt-head">
          <div class="brand"><span class="logo kf"><img src="img/kofi-logo.png" alt="" width="20" height="16"></span><h2>Ko-fi</h2></div>
          <span class="chip" data-zh="全球" data-en="Global">全球</span>
        </div>
        <p data-zh="用 PayPal 或银行卡，在 Ko-fi 上请作者喝一杯。" data-en="Buy the author a coffee on Ko-fi with PayPal or a card.">用 PayPal 或银行卡，在 Ko-fi 上请作者喝一杯。</p>
        <a class="qr kofi-link" href="#" target="_blank" rel="noopener"><img src="img/kofi-code.jpg" alt="Ko-fi QR code" width="220" height="220"></a>
        <a class="cap kofi-link" href="#" target="_blank" rel="noopener">
          <span data-zh="扫码，或点这里打开 Ko-fi" data-en="Scan, or open Ko-fi here">扫码，或点这里打开 Ko-fi</span>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2.5h4.5V7M13.5 2.5 7 9M11.5 9.5v3a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3"/></svg>
        </a>
      </article>
    </section>

    <p class="thanks" data-zh="谢谢每一位支持 ScreenReplay 的朋友。" data-en="Thank you to everyone who supports ScreenReplay.">谢谢每一位支持 ScreenReplay 的朋友。</p>
  </main>

  <footer>
    <span>ScreenReplay</span>
    <span class="sp"></span>
    <a href="https://github.com/motion-space/screenreplay" target="_blank" rel="noopener">GitHub</a>
    <a href="changelog" data-zh="更新日志" data-en="Changelog">更新日志</a>
    <a href="privacy" data-zh="隐私政策" data-en="Privacy Policy">隐私政策</a>
    <span>© 2026 pengx17</span>
  </footer>
</div>
<script>
// Ko-fi's page (empty: the card stays hidden)
(function () {
  var KOFI = "https://ko-fi.com/pengx17";
  if (KOFI) {
    document.querySelectorAll(".kofi-link").forEach(function (a) { a.href = KOFI; });
    document.getElementById("kofi").hidden = false;
  }
})();
</script>
<script src="lang.js"></script>
</body>
</html>
